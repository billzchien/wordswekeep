<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E6E6E6">
  <!-- Staging admin: never indexed. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Admin · Words We Keep</title>
  <link rel="preconnect" href="https://fonts.wordswekeep.org"> <!-- every font, Google's included, comes from the site's fonts Worker (workers/fonts) -->
  <link rel="preconnect" href="https://fonts.wordswekeep.org" crossorigin>
  <link href="https://fonts.wordswekeep.org/css2?family=Cal+Sans&family=Crimson+Pro:ital@0;1&family=Instrument+Serif:ital@0;1&family=Noto+Sans:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@500&family=Noto+Serif+TC:wght@500&family=Noto+Serif:ital@0;1&family=Noto+Sans+Arabic&family=Noto+Sans+Hebrew&family=Noto+Sans+Thai&family=Noto+Sans+Devanagari&family=Noto+Serif+Hebrew&family=Noto+Serif+Thai&family=Noto+Serif+Devanagari&family=BIZ+UDPMincho&family=Gowun+Batang&family=Cormorant+Garamond&family=GFS+Didot&family=Scheherazade+New&family=Murecho:wght@700&family=IBM+Plex+Sans+KR:wght@700&family=Golos+Text:wght@600&family=Commissioner:wght@700&family=Alexandria:wght@700&family=IBM+Plex+Sans+Hebrew:wght@600&family=Bai+Jamjuree:wght@600&family=Poppins:wght@700&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin" id="admin" data-view="list" data-tab="live">

    <!-- Everything scrolls inside this box; the chrome and the guards stay put (see .admin in admin.css). -->
    <div class="scroll" id="scroll">

      <!-- Live / Pending / Archive -->
      <section class="page list" id="listView" aria-label="Quotes">
        <div class="thead" id="thead">
          <!-- Search (Figma 307:2989), Live and Pending: the icon opens a 100px field beside it. Stays in place while the heads are redrawn. -->
          <div class="search" id="search" role="search">
            <button type="button" class="search-btn" id="searchBtn" aria-label="Search" aria-expanded="false" aria-controls="searchBox"><span class="icon icon-search"></span></button>
            <div class="search-box" id="searchBox">
              <input class="search-field" id="searchField" type="text" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search the list" tabindex="-1">
              <button type="button" class="search-end" id="searchEnd" aria-label="Clear the search" tabindex="-1"><span class="icon icon-arrow"></span><span class="icon icon-x"></span></button>
            </div>
          </div>
        </div>
        <div class="rows" id="rows"></div>
        <p class="empty" id="empty" hidden></p>
      </section>

      <!-- Edit / review one quote. Left: the quote itself. Right: what the submitter added. -->
      <section class="page edit" id="editView" aria-label="Edit quote" hidden>
        <div class="edit-meta">
          <p id="editNo"></p>
          <p id="editDate"></p>
        </div>
        <div class="edit-cols">
          <div class="col">
            <div class="sec">
              <p class="sec-title">Quote</p>
              <div class="stack">
                <div class="fw"><textarea class="field" id="fText" placeholder="The words, in English" rows="3" aria-label="The words, in English"></textarea></div>
                <div class="fold" id="fOriginalWrap" hidden><div class="stack"><div class="fw fw--closable"><textarea class="field" id="fOriginal" placeholder="The words in original language" rows="3" aria-label="The words in original language"></textarea><button type="button" class="fw-close" id="origClose" aria-label="Remove the original language"><span class="icon icon-x"></span></button></div><div class="fw" id="fLang"></div></div></div>
              </div>
              <button type="button" class="more" id="origToggle"><span>In original language</span><span class="icon icon-plus"></span></button>
            </div>
            <div class="sec">
              <p class="sec-title">Category</p>
              <div class="chk-grid" id="catList" role="group" aria-label="Categories"></div>
            </div>
            <div class="sec">
              <p class="sec-title">Source</p>
              <!-- Who said it and where it comes from, one group (the author had a title of its own until 2026-10-04). -->
              <div class="stack">
                <div class="fw" id="fWho"></div>
                <div class="fold is-open is-settled" id="fNameRowWrap"><div class="row2">
                  <div class="fw"><input class="field" id="fName" type="text" placeholder="Author" autocomplete="off" aria-label="Author"></div>
                  <div class="fw" id="fCountry"></div>
                </div></div>
                <div class="fold" id="fNativeWrap" hidden><div class="fw"><input class="field" id="fNative" type="text" placeholder="Name in original language" autocomplete="off" aria-label="Author's name in original language"></div></div>
                <div class="fold" id="fOriginWrap" hidden><div class="fw" id="fOrigin"></div></div>
                <div class="row2">
                  <div class="fw" id="fKind"></div>
                  <div class="fw" id="fYear"></div>
                </div>
                <div class="fold" id="fTitleWrap" hidden><div class="fw"><input class="field" id="fTitle" type="text" placeholder="Source name" autocomplete="off" aria-label="Source name"></div></div>
                <div class="fold" id="fLinkWrap" hidden><div class="fw"><input class="field" id="fLink" type="url" placeholder="Source link" autocomplete="off" inputmode="url" aria-label="Source link"></div></div>
                <!-- A YouTube, Vimeo, TikTok or Instagram link: the platform's player, 16:9, to check the video; Spotify or Apple Music: its dark player at its own height (js/admin.js → drawVideo). -->
                <div class="fold" id="fVideoWrap" hidden><div class="stack">
                  <div class="video-preview" id="fVideo"></div>
                  <!-- A video with a thumbnail: "Crop thumbnail" shows the thumbnail with the site's portrait window over it; "Done" keeps it as source.crop (js/admin.js → startCrop, Figma 500:3978). -->
                  <div class="fold" id="fCropWrap" hidden><div class="row2">
                    <!-- While cropping, once the window has moved: steps back one change at a time, greyed out at the start. -->
                    <button type="button" class="chk crop-btn" id="fCropUndo" hidden><span>Undo</span></button>
                    <button type="button" class="chk crop-btn" id="fCropBtn"><span class="icon icon-crop" aria-hidden="true"></span><span>Crop thumbnail</span></button>
                  </div></div>
                </div></div>
                <!-- A book: its cover, picked here (js/admin.js → drawCovers). Covers found from the title and
                     author (Apple Books, Open Library), "No cover", or an image address pasted. Stored as source.cover. -->
                <div class="fold" id="fCoverWrap" hidden><div class="stack">
                  <div class="cover-grid" id="fCovers" role="radiogroup" aria-label="Cover"></div>
                  <div class="row2">
                    <button type="button" class="chk" role="radio" aria-checked="true" id="fNoCover">
                      <span class="chk-box" aria-hidden="true"><span class="icon icon-check"></span></span><span>No cover</span>
                    </button>
                    <!-- The tiles' colour: the next of the quote's categories' notes backgrounds (only for looking; not stored). -->
                    <button type="button" class="chk cover-ground" id="fCoverBg"><span class="icon icon-refresh" aria-hidden="true"></span><span>Note background</span></button>
                  </div>
                  <div class="fw"><input class="field" id="fCoverLink" type="url" placeholder="Or paste a cover image, or its address" autocomplete="off" inputmode="url" aria-label="Paste a cover image, or its address"></div>
                </div></div>
              </div>
            </div>
            <div class="sec">
              <p class="sec-title">Other</p>
              <!-- Checked: the archive never opens on this quote (js/app.js, the first deal). Stored as `notFirst`. -->
              <button type="button" class="chk" role="checkbox" aria-checked="false" id="fNotFirst">
                <span class="chk-box" aria-hidden="true"><span class="icon icon-check"></span></span><span>Don’t show as the first quote</span>
              </button>
            </div>
          </div>
          <div class="col">
            <div class="sec">
              <p class="sec-title">Context</p>
              <div class="fw"><textarea class="field" id="fContext" placeholder="Background, or the paragraph the words come from" rows="3" aria-label="Context"></textarea></div>
            </div>
            <!-- Closed until there is an annotation: the title is the "Annotation +" button. Open: the
                 title with a × at the field's right edge; the × drops every annotation and closes. -->
            <div class="sec sec--opt" id="annSec">
              <div class="sec-head">
                <button type="button" class="more" id="annOpen"><span>Annotation</span><span class="icon icon-plus"></span></button>
                <p class="sec-title">Annotation</p>
                <button type="button" class="sec-close" id="annClose" aria-label="Remove annotations"><span class="icon icon-x"></span></button>
              </div>
              <div class="fold" id="annWrap" hidden><div class="sec-body">
                <div class="ann-list" id="annRows"></div>
                <button type="button" class="more" id="annAnother"><span>Another</span><span class="icon icon-plus"></span></button>
              </div></div>
            </div>
            <div class="sec">
              <p class="sec-title">Personal note</p>
              <!-- The note and who wrote it, one group (no label of its own for the name). -->
              <div class="stack">
                <div class="fw"><textarea class="field" id="fReflection" placeholder="Notes" rows="3" aria-label="Personal note"></textarea></div>
                <div class="fw"><input class="field" id="fKeptBy" type="text" placeholder="Name" autocomplete="off" aria-label="Name of who keeps the words"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- The quote's face (Figma 314:5424): the faces drawn for its length, and the quote set in
             the chosen one as the archive shows it at this breakpoint, scaled to fit — the English
             words, and under them the original-language ones when there are any. -->
        <div class="sec edit-font">
          <p class="sec-title">Font</p>
          <div class="font-box">
            <!-- One checkbox row per face, one chosen at a time (js/admin.js → fontPicker): all one width, as wide as the longest name needs, in as few even rows as the width allows. -->
            <div class="chk-grid font-grid" id="fFont" role="radiogroup" aria-label="Font"></div>
            <div class="fw font-drop" id="fFontDrop"></div><!-- a phone: the dropdown instead (css) -->
            <div class="font-view" id="fontView" aria-hidden="true"><div class="font-stage" id="fontStage"></div></div>
            <div class="font-view" id="fontViewNative" aria-hidden="true" hidden><div class="font-stage" id="fontStageNative"></div></div>
          </div>
        </div>
      </section>

      <!-- Thoughts under one quote (Figma 526:1024): the quote, then each thought — waiting ones
           first, newest first, then the approved — as fields (Notes, Name) with its own buttons:
           Cleanup / Remove / Approve while it waits, Remove alone once approved (js/admin.js → openThoughts). -->
      <section class="page thoughts" id="thoughtsView" aria-label="Thoughts" hidden>
        <div class="edit-meta"><p id="thNo"></p></div>
        <p class="th-quote" id="thQuote"></p>
        <div class="th-list" id="thList"></div>
      </section>

      <!-- Fonts: tune a quote face (its size at each length, leading, tracking) on a short, a
           medium and a long quote set as the archive sets them; Save puts it on the site. -->
      <section class="page faces" id="fontsView" aria-label="Quote faces" hidden>
        <div class="faces-top">
          <div class="ctl ctl--face">Face
            <div class="combo" id="facePick">
              <button type="button" class="field" id="faceBtn" aria-haspopup="listbox" aria-expanded="false"></button>
              <span class="combo-btn"><span class="icon icon-chevron"></span></span>
              <div class="combo-list" id="faceList" role="listbox" hidden></div>
            </div>
          </div>
          <div class="ctls">
            <label class="ctl">Short<input class="field" id="tScaleL" type="number" step="0.01" min="0.3" max="3" inputmode="decimal" aria-label="Scale, short quotes"></label>
            <label class="ctl"><span class="h-long">Medium</span><span class="h-short">Med.</span><input class="field" id="tScaleM" type="number" step="0.01" min="0.3" max="3" inputmode="decimal" aria-label="Scale, medium quotes"></label>
            <label class="ctl">Long<input class="field" id="tScaleS" type="number" step="0.01" min="0.3" max="3" inputmode="decimal" aria-label="Scale, long quotes"></label>
          </div>
          <div class="ctls">
            <label class="ctl"><span class="h-long">Leading</span><span class="h-short">Lead.</span><input class="field" id="tLeading" type="number" step="0.01" min="0.8" max="2" inputmode="decimal"></label>
            <label class="ctl"><span class="h-long">Tracking %</span><span class="h-short">Track.</span><input class="field" id="tTracking" type="number" step="0.1" min="-10" max="20" inputmode="decimal" aria-label="Tracking, percent"></label>
          </div>
          <div class="ctls">
            <div class="ctl"><span class="h-long">Comparison</span><span class="h-short">Comp.</span><button type="button" class="field" id="faceRef" aria-pressed="true" aria-label="Compare with Instrument"></button></div>
          </div>
        </div>
        <div id="faceBoards"></div>
      </section>
    </div>

    <!-- Guards: the paper fading in over a progressive blur, so rows dissolve under the chrome (css/form.css). -->
    <div class="guard guard--top" aria-hidden="true"></div>
    <div class="guard guard--bottom" aria-hidden="true"></div>

    <!-- Chrome: the list -->
    <div class="chrome-list" id="chromeList">
      <button type="button" class="chrome home" role="link" data-href="#live" aria-label="Live quotes"><span class="icon icon-mark"></span></button>
      <nav class="chrome tabs" id="tabs" aria-label="Sections">
        <button type="button" class="tab" role="link" data-href="#live" data-tab="live">Live</button>
        <button type="button" class="tab" role="link" data-href="#pending" data-tab="pending">Pending<span id="pendingCount"></span></button>
        <button type="button" class="tab" role="link" data-href="#archive" data-tab="archive">Archive</button>
        <button type="button" class="tab" role="link" data-href="#thoughts" data-tab="thoughts">Thoughts<span id="thoughtsCount"></span></button>
        <button type="button" class="tab" role="link" data-href="#fonts" data-tab="fonts">Fonts</button>
      </nav>
      <div class="chrome cta" id="ctaLive">
        <p class="cta-meta" id="lastPublished"></p>
        <button type="button" class="btn btn--primary btn--sm btn--w" id="publishBtn" disabled>Publish</button>
      </div>
      <div class="chrome cta" id="ctaFonts" hidden>
        <button type="button" class="btn btn--sm" id="facesReset" disabled>Reset</button>
        <button type="button" class="btn btn--primary btn--sm btn--w" id="facesSave" disabled>Publish</button> <!-- (it puts the faces on the site at once: "Publish", as for the quotes — Bill, 2026-10-09; it said "Save") -->
      </div>
      <div class="chrome cta" id="ctaArchive" hidden>
        <button type="button" class="btn btn--primary btn--sm btn--w" id="removeAllBtn">Remove all</button>
      </div>
    </div>

    <!-- Chrome: the edit view -->
    <div class="chrome-edit" id="chromeEdit" hidden>
      <button type="button" class="chrome link back" id="backBtn" role="link" data-href="#live">Back</button>
      <div class="chrome cta">
        <div class="cta-links">
          <button type="button" class="link" id="revertBtn">Revert</button>
          <button type="button" class="link" id="cleanupBtn">Auto cleanup</button>
        </div>
        <button type="button" class="btn btn--primary btn--sm" id="saveBtn" data-for="live">Save</button>
        <button type="button" class="btn btn--soft btn--sm" id="archiveBtn" data-for="pending">Archive</button>
        <button type="button" class="btn btn--primary btn--sm" id="approveBtn" data-for="pending">Approve</button>
      </div>
      <div class="chrome arrows">
        <button id="prevBtn" aria-label="Previous quote"><span class="icon icon-arrow"></span></button>
        <button id="nextBtn" aria-label="Next quote"><span class="icon icon-arrow icon-arrow--down"></span></button>
      </div>
    </div>

    <!-- Login (Figma 299:1030): over everything until the Worker has let the admin in. -->
    <form class="login" id="login" hidden novalidate>
      <span class="chrome home"><span class="icon icon-mark"></span></span>
      <p class="chrome login-title">Words We Keep Library</p>
      <div class="login-row">
        <div class="fw" id="fPasswordWrap"><input class="field" id="fPassword" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"></div>
        <button type="submit" class="btn btn--primary" id="enterBtn">Enter</button>
      </div>
    </form>

    <!-- Toast (Figma 314:5664): what was just done, at the bottom of the window. -->
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

    <!-- "Are you sure?" (Figma 303:2108) -->
    <div class="popup-layer" id="popup" hidden>
      <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupText">
        <p id="popupText"></p>
        <div class="popup-btns">
          <button type="button" class="btn btn--sm" id="popupNo">Not yet</button>
          <button type="button" class="btn btn--primary btn--sm" id="popupYes">Remove</button>
        </div>
      </div>
    </div>
  </div>

  <noscript>The library needs JavaScript.</noscript>
  <script src="../js/admin.js"></script>
</body>
</html>
