<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#E6E6E6"> <!-- kept in step with the page by js/app.js (syncChromeColor) -->
  <title>Words We Keep</title>
  <link rel="preconnect" href="https://fonts.wordswekeep.org"> <!-- every font, Google's included, comes from the site's fonts Worker (workers/fonts) -->
  <link rel="preconnect" href="https://fonts.wordswekeep.org" crossorigin>
  <link href="https://fonts.wordswekeep.org/css2?family=Cal+Sans&family=Crimson+Pro:ital@0;1&family=Instrument+Serif:ital@0;1&family=Noto+Sans:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@500&family=Noto+Serif+TC:wght@500&family=Noto+Serif:ital@0;1&family=Noto+Sans+Arabic:wght@400;500&family=Noto+Sans+Hebrew&family=Noto+Sans+Thai&family=Noto+Sans+Devanagari&family=Noto+Serif+Hebrew&family=Noto+Serif+Thai&family=Noto+Serif+Devanagari&family=BIZ+UDPMincho&family=Gowun+Batang&family=Cormorant+Garamond&family=GFS+Didot&family=Scheherazade+New&family=Murecho:wght@700&family=IBM+Plex+Sans+KR:wght@700&family=Golos+Text:wght@600&family=Commissioner:wght@700&family=Alexandria:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;600&family=Bai+Jamjuree:wght@500;600&family=Poppins:wght@400;700&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
  <!-- The language button's own fonts (js/app.js → LANG_BUTTON): only the pieces with its labels' letters load. -->
  <link href="https://fonts.wordswekeep.org/css2?family=Inter:wght@500&family=Manrope:wght@600&family=IBM+Plex+Sans+Arabic:wght@400&family=Hind+Siliguri:wght@400&family=Noto+Sans+Tamil:wght@400&display=swap" rel="stylesheet">
  <!-- Search and link previews (the share image: 1200 × 630; the iPhone home-screen icon: 180 × 180) -->
  <meta name="description" content="A collection of words from every culture, time, and corner of life, shared by the people who hold them close. Discover them, or share the ones you keep.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Words We Keep">
  <meta property="og:title" content="Words We Keep">
  <meta property="og:description" content="A collection of words from every culture, time, and corner of life, shared by the people who hold them close. Discover them, or share the ones you keep.">
  <link rel="canonical" href="https://wordswekeep.org/">
  <meta property="og:url" content="https://wordswekeep.org/">
  <meta property="og:image" content="https://wordswekeep.org/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Words We Keep">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="favicon.ico" sizes="32x32"> <!-- for browsers without SVG icons (older Safari) -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/form.css"> <!-- the fields and buttons of the thoughts box in notes (one style everywhere) -->
  <link rel="stylesheet" href="css/fonts.css">
</head>
<body>
  <div class="app is-typing" id="app" data-mode="main"> <!-- is-typing: Notes and the arrows stay hidden from the first paint until the quote has typed itself in (js/app.js → arrive) -->

    <!-- Main: one quote per screen, snapping deck -->
    <main class="deck" id="deck" aria-live="polite">
      <div class="track" id="track"></div>
    </main>

    <!-- Notes mode -->
    <section class="notes" id="notes" aria-label="Notes" hidden>
      <ul class="n-cats" id="nCats"></ul>
      <div class="n-pin" id="nPin">
        <div class="n-meta n-from">
          <p>Words from</p>
          <p class="n-indent n-indent--from" id="nFrom"></p>
        </div>
        <div class="q-wrap" id="nQuoteWrap"></div>
        <div id="nVideoPin"></div>
      </div>
      <div class="n-col" id="nCol">
        <div id="nVideoCol"></div>
        <div class="n-meta n-kept">
          <p>Kept by</p>
          <p class="n-indent n-indent--kept" id="nKept"></p>
        </div>
        <div class="n-body" id="nBody"></div>
      </div>
    </section>
    <!-- Mobile notes: the fading top bar (outside the scroller so it stays put; see .app in app.css) -->
    <div class="n-topfade" aria-hidden="true"></div>

    <!-- Chrome -->
    <button class="chrome menu-btn" id="menuBtn" aria-label="Menu"><svg class="sym" id="markSym" viewBox="0 0 60 60" aria-hidden="true"></svg></button> <!-- the current category's symbol, drawn by js/app.js (Symbols) -->
    <p class="chrome number" id="number"></p>
    <button class="chrome link notes-btn" id="notesBtn">Notes</button>
    <button class="chrome link add-btn" id="addBtn" role="link" data-href="add">Add words</button> <!-- a button, not <a href>: no address strip on hover (js/app.js → follow) -->
    <div class="chrome arrows">
      <button id="prevBtn" aria-label="Previous quote"><span class="arrow-crop"><span class="icon icon-arrow"></span></span></button> <!-- .arrow-crop: the box a pressed arrow rolls in (js/app.js → press) -->
      <button id="nextBtn" aria-label="Next quote"><span class="arrow-crop"><span class="icon icon-arrow icon-arrow--down"></span></span></button>
    </div>

    <!-- Word annotation overlay -->
    <div class="overlay ann-overlay" id="annOverlay" hidden>
      <button class="x-btn ann-back" id="annBack" aria-label="Close"></button>
      <p class="ann-word" id="annWord"></p>
      <p class="ann-text" id="annText"></p>
    </div>

    <!-- Video overlay -->
    <div class="overlay video-overlay" id="videoOverlay" hidden>
      <div class="video-box" id="videoBox">
        <button class="x-btn video-close" id="videoClose" aria-label="Close"></button>
        <div class="video-frame" id="videoFrame"></div>
      </div>
    </div>

    <!-- A word at the foot of the window ("Video not available."): js/app.js → toast -->
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

    <!-- Menu -->
    <nav class="menu" id="menu" aria-label="Categories" hidden>
      <button class="link menu-back" id="menuBack">Back</button>
      <svg class="sym menu-sym" id="menuSym" viewBox="0 0 60 60" aria-hidden="true"></svg> <!-- one symbol for the whole menu: it redraws into the previewed category's -->
      <ul class="cat-list" id="catList"></ul>
      <aside class="cat-desc">
        <p id="catDescText"></p>
        <span class="cat-desc-line" aria-hidden="true"></span>
        <p id="catCount"></p>
      </aside>
      <button class="menu-apply" id="menuApply"></button>
    </nav>
  </div>

  <!-- "Scan" effect for entering notes: RGB-split filters are generated into these defs by
       js/app.js (scanIn), at a strength that depends on how far down the screen an item sits.
       Native SVG filters — no library, no external code. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs id="rgbDefs"></defs>
  </svg>

  <noscript>Words We Keep needs JavaScript to show its quotes.</noscript>
  <script src="js/app.js"></script>
</body>
</html>
