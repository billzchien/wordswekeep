<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#E6E6E6"> <!-- kept in step with the page by js/app.js (syncChromeColor) -->
  <!-- Staging: keep out of search engines until launch. Remove on publish. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Words We Keep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Crimson+Pro:ital@0;1&family=Instrument+Serif:ital@0;1&family=Noto+Sans:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/fonts.css">
</head>
<body>
  <div class="app is-typing" id="app" data-mode="main"> <!-- is-typing: Notes and the arrows stay hidden from the first paint until the quote has typed itself in (js/app.js → arrive) -->

    <!-- Main: one quote per screen, snapping deck -->
    <main class="deck" id="deck" aria-live="polite">
      <div class="track" id="track"></div>
    </main>

    <!-- Notes mode -->
    <section class="notes" id="notes" aria-label="Notes" hidden>
      <ul class="n-cats" id="nCats"></ul>
      <div class="n-pin" id="nPin">
        <div class="n-meta n-from">
          <p>Words from</p>
          <p class="n-indent n-indent--from" id="nFrom"></p>
        </div>
        <div class="q-wrap" id="nQuoteWrap"></div>
        <div id="nVideoPin"></div>
      </div>
      <div class="n-col" id="nCol">
        <div id="nVideoCol"></div>
        <div class="n-meta n-kept">
          <p>Kept by</p>
          <p class="n-indent n-indent--kept" id="nKept"></p>
        </div>
        <div class="n-body" id="nBody"></div>
      </div>
    </section>
    <!-- Mobile notes: the fading top bar (outside the scroller so it stays put; see .app in app.css) -->
    <div class="n-topfade" aria-hidden="true"></div>

    <!-- Chrome -->
    <button class="chrome menu-btn" id="menuBtn" aria-label="Menu"><svg class="sym" id="markSym" viewBox="0 0 60 60" aria-hidden="true"></svg></button> <!-- the current category's symbol, drawn by js/app.js (Symbols) -->
    <p class="chrome number" id="number"></p>
    <button class="chrome link notes-btn" id="notesBtn">Notes</button>
    <button class="chrome link add-btn" id="addBtn" role="link" data-href="add.html">Add words</button> <!-- a button, not <a href>: no address strip on hover (js/app.js → follow) -->
    <div class="chrome arrows">
      <button id="prevBtn" aria-label="Previous quote"><span class="arrow-crop"><span class="icon icon-arrow"></span></span></button> <!-- .arrow-crop: the box a pressed arrow rolls in (js/app.js → press) -->
      <button id="nextBtn" aria-label="Next quote"><span class="arrow-crop"><span class="icon icon-arrow icon-arrow--down"></span></span></button>
    </div>

    <!-- Word annotation overlay -->
    <div class="overlay ann-overlay" id="annOverlay" hidden>
      <button class="x-btn ann-back" id="annBack" aria-label="Close"></button>
      <p class="ann-word" id="annWord"></p>
      <p class="ann-text" id="annText"></p>
    </div>

    <!-- Video overlay -->
    <div class="overlay video-overlay" id="videoOverlay" hidden>
      <div class="video-box" id="videoBox">
        <button class="x-btn video-close" id="videoClose" aria-label="Close"></button>
        <div class="video-frame" id="videoFrame"></div>
      </div>
    </div>

    <!-- Menu -->
    <nav class="menu" id="menu" aria-label="Categories" hidden>
      <button class="link menu-back" id="menuBack">Back</button>
      <svg class="sym menu-sym" id="menuSym" viewBox="0 0 60 60" aria-hidden="true"></svg> <!-- one symbol for the whole menu: it redraws into the previewed category's -->
      <ul class="cat-list" id="catList"></ul>
      <aside class="cat-desc">
        <p id="catDescText"></p>
        <span class="cat-desc-line" aria-hidden="true"></span>
        <p id="catCount"></p>
      </aside>
      <button class="menu-apply" id="menuApply"></button>
    </nav>
  </div>

  <!-- "Scan" effect for entering notes: RGB-split filters are generated into these defs by
       js/app.js (scanIn), at a strength that depends on how far down the screen an item sits.
       Native SVG filters — no library, no external code. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs id="rgbDefs"></defs>
  </svg>

  <noscript>Words We Keep needs JavaScript to show its quotes.</noscript>
  <script src="js/app.js"></script>
</body>
</html>
