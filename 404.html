<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // A quote's number as the address (wordswekeep.org/23, since 2026-10-06): there is no such
    // page, so GitHub Pages serves this one; it leaves the number where the archive keeps the
    // quote a tab was on (sessionStorage 'wwk-quote', js/app.js) and goes to the archive, which
    // opens that quote. Nothing of this page is drawn first.
    (() => {
      const m = /^\/(\d+)\/?$/.exec(location.pathname);
      if (!m) return;
      try { sessionStorage.setItem('wwk-quote', m[1]); } catch (e) { /* no storage: the archive opens as usual */ }
      location.replace('/');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E6E6E6">
  <meta name="robots" content="noindex">
  <title>Page Not Found · Words We Keep</title>
  <!-- GitHub Pages serves this for any missing address, at any depth: every path is from the root. -->
  <link rel="preconnect" href="https://fonts.wordswekeep.org"> <!-- every font, Google's included, comes from the site's fonts Worker (workers/fonts) -->
  <link rel="preconnect" href="https://fonts.wordswekeep.org" crossorigin>
  <link href="https://fonts.wordswekeep.org/css2?family=Crimson+Pro:ital@0;1&display=swap" rel="stylesheet">
  <!-- Search and link previews (the share image: 1200 × 630; the iPhone home-screen icon: 180 × 180) -->
  <meta name="description" content="A collection of words from every culture, time, and corner of life, shared by the people who hold them close. Discover them, or share the ones you keep.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Words We Keep">
  <meta property="og:title" content="Words We Keep">
  <meta property="og:description" content="A collection of words from every culture, time, and corner of life, shared by the people who hold them close. Discover them, or share the ones you keep.">
  <meta property="og:url" content="https://wordswekeep.org/">
  <meta property="og:image" content="https://wordswekeep.org/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Words We Keep">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="32x32"> <!-- for browsers without SVG icons (older Safari) -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/form.css">
</head>
<body>
  <!-- Figma 421:1885: the thank-you screen of the form (add.html, Figma 227:3992), one button,
       narrowed to the symbol and centred (css/form.css → .done--404). -->
  <div class="form is-done">
    <div class="steps">
      <section class="step" aria-label="Page not found">
        <div class="content content--40 done done--404" id="done">
          <div class="done-sym"><svg class="sym" id="doneSym" viewBox="0 0 60 60" aria-hidden="true"></svg></div>
          <p class="done-text">Oops. There must be a mistake.</p>
          <div class="done-btns">
            <button type="button" class="btn btn--primary" role="link" id="homeBtn">View collection</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    // As the form's showDone (js/form.js): the All symbol draws in, the text and the button fade
    // up. Without the symbols' files the still image stands.
    const done = document.getElementById('done');
    const box = done.querySelector('.done-sym');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.getElementById('homeBtn').addEventListener('click', () => { location.href = '/'; });
    try {
      const [lib, data] = await Promise.all([
        import('/assets/symbols/ribbon-draw.js'),
        fetch('/assets/symbols/symbol-draw-in.json').then((r) => { if (!r.ok) throw new Error(`symbols: ${r.status}`); return r.json(); }),
      ]);
      const model = lib.createModel(data);
      const r = lib.createRenderer(document.getElementById('doneSym'), model);
      r.drawIn('All', 0);
      done.classList.add('is-in');
      if (reduce) r.drawIn('All', 1); else lib.play(model, (t) => r.drawIn('All', t));
    } catch (err) {
      console.error(err);
      box.classList.add('is-static');
      done.classList.add('is-in');
    }
  </script>
</body>
</html>
